name: Test and build desktop apps

on:
  push:
    branches: [main, codex-desktop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'linux'
        run: xvfb-run -a npm run smoke:animation -- --no-sandbox
      - run: npm run prepublish:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: WhaleGirl-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
